<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200">
  <defs>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00E5FF"/><stop offset="1" stop-color="#C026D3"/></linearGradient>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7C8CFF"/></marker>
  </defs>
  <rect width="1200" height="200" fill="#0D1117"/>
  <style>.b{fill:#111827;stroke:url(#ac);stroke-width:2}.t{font:700 20px Segoe UI,Helvetica,Arial,sans-serif;fill:#E6EDF3;text-anchor:middle}.s{font:14px Consolas,Menlo,monospace;fill:#9AA7B8;text-anchor:middle}</style>
  <g>
    <rect class="b" x="20" y="50" width="190" height="100" rx="14"/><text class="t" x="115" y="95">Target</text><text class="s" x="115" y="122">IP / Host / URL</text>
    <rect class="b" x="260" y="50" width="190" height="100" rx="14"/><text class="t" x="355" y="95">Validate</text><text class="s" x="355" y="122">normalize input</text>
    <rect class="b" x="500" y="50" width="190" height="100" rx="14"/><text class="t" x="595" y="95">Module</text><text class="s" x="595" y="122">DNS / TLS / HTTP</text>
    <rect class="b" x="740" y="50" width="190" height="100" rx="14"/><text class="t" x="835" y="95">Rich Table</text><text class="s" x="835" y="122">animated output</text>
    <rect class="b" x="980" y="50" width="190" height="100" rx="14"/><text class="t" x="1075" y="95">History</text><text class="s" x="1075" y="122">JSON / CSV / TXT</text>
  </g>
  <g stroke="#7C8CFF" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#ar)">
    <line x1="212" y1="100" x2="256" y2="100"><animate attributeName="stroke-dashoffset" from="22" to="0" dur="1s" repeatCount="indefinite"/></line>
    <line x1="452" y1="100" x2="496" y2="100"><animate attributeName="stroke-dashoffset" from="22" to="0" dur="1s" repeatCount="indefinite"/></line>
    <line x1="692" y1="100" x2="736" y2="100"><animate attributeName="stroke-dashoffset" from="22" to="0" dur="1s" repeatCount="indefinite"/></line>
    <line x1="932" y1="100" x2="976" y2="100"><animate attributeName="stroke-dashoffset" from="22" to="0" dur="1s" repeatCount="indefinite"/></line>
  </g>
</svg>
