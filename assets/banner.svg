<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="380" viewBox="0 0 1280 380">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070D"/><stop offset="0.6" stop-color="#0F1530"/><stop offset="1" stop-color="#2A1065"/>
    </linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00E5FF"/><stop offset="0.55" stop-color="#7C8CFF"/><stop offset="1" stop-color="#C026D3"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#A855F7" stop-opacity="0.45"/><stop offset="1" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00E5FF" stop-opacity="0"/><stop offset="1" stop-color="#00E5FF" stop-opacity="0.55"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#00E5FF" stroke-opacity="0.06"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <rect width="1280" height="380" fill="url(#bg)"/>
  <rect width="1280" height="380" fill="url(#grid)"/>
  <rect width="1280" height="380" fill="url(#glow)"/>

  <!-- floating particles -->
  <g fill="#00E5FF">
    <circle cx="120" cy="60" r="2"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="420" cy="330" r="2"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="50" r="1.5"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="320" r="2"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="3.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- radar -->
  <g transform="translate(1030,190)">
    <circle r="150" fill="#00E5FF" fill-opacity="0.04" stroke="#00E5FF" stroke-opacity="0.35"/>
    <circle r="110" fill="none" stroke="#7C8CFF" stroke-opacity="0.35"/>
    <circle r="70" fill="none" stroke="#C026D3" stroke-opacity="0.45"/>
    <circle r="30" fill="none" stroke="#00E5FF" stroke-opacity="0.7"/>
    <path d="M-160 0H160M0-160V160" stroke="#00E5FF" stroke-opacity="0.2"/>
    <g>
      <path d="M0 0 L150 0 A150 150 0 0 0 129.9 -75 Z" fill="url(#sweep)"/>
      <line x1="0" y1="0" x2="150" y2="0" stroke="#00E5FF" stroke-width="2.5"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="5s" repeatCount="indefinite"/>
    </g>
    <g>
      <circle cx="75" cy="-70" r="6" fill="#39FF14"><animate attributeName="r" values="4;9;4" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/></circle>
      <circle cx="-80" cy="45" r="5" fill="#FFBD2E"><animate attributeName="r" values="3;8;3" dur="2.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0.3;1" dur="2.6s" repeatCount="indefinite"/></circle>
      <circle cx="30" cy="100" r="5" fill="#00E5FF"><animate attributeName="r" values="3;8;3" dur="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0.3;1" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="-30" cy="-95" r="4" fill="#C026D3"><animate attributeName="opacity" values="1;0.2;1" dur="1.8s" repeatCount="indefinite"/></circle>
    </g>
  </g>

  <!-- title -->
  <text x="70" y="140" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="96" font-weight="900" fill="#00E5FF" opacity="0.35" filter="url(#blur)" letter-spacing="3">VIBETRACK</text>
  <text x="70" y="140" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="96" font-weight="900" fill="url(#ac)" letter-spacing="3">VIBETRACK</text>
  <text x="74" y="206" font-family="Consolas, Menlo, monospace" font-size="42" font-weight="700" fill="#E6EDF3" letter-spacing="22">OSINT</text>
  <rect x="74" y="228" width="260" height="4" rx="2" fill="url(#ac)"><animate attributeName="width" values="60;260;60" dur="4s" repeatCount="indefinite"/></rect>
  <text x="74" y="276" font-family="Consolas, Menlo, monospace" font-size="22" fill="#9AA7B8">Network Intelligence  •  DNS  •  Web Security</text>

  <!-- chips -->
  <g font-family="Consolas, Menlo, monospace" font-size="16" font-weight="700">
    <rect x="74" y="304" width="150" height="34" rx="17" fill="#00E5FF" fill-opacity="0.12" stroke="#00E5FF"/>
    <text x="149" y="326" text-anchor="middle" fill="#00E5FF">14 MODULES</text>
    <rect x="238" y="304" width="150" height="34" rx="17" fill="#39FF14" fill-opacity="0.12" stroke="#39FF14"/>
    <text x="313" y="326" text-anchor="middle" fill="#39FF14">TERMUX READY</text>
    <rect x="402" y="304" width="130" height="34" rx="17" fill="#C026D3" fill-opacity="0.15" stroke="#C026D3"/>
    <text x="467" y="326" text-anchor="middle" fill="#E879F9">MIT LICENSE</text>
  </g>
</svg>
